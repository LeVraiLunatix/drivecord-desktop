"$schema" = "schemas/schema.json"

# App-command permissions referenced by `capabilities/remote.json` so the
# first-party login page on drivecord.app can complete the token handoff.
# The local windows reference them too (capabilities/default.json).

[[permission]]
identifier = "allow-save-token"
description = "Autorise la commande save_token."
commands.allow = ["save_token"]

[[permission]]
identifier = "allow-get-token"
description = "Autorise la commande get_token."
commands.allow = ["get_token"]

[[permission]]
identifier = "allow-enter-shell"
description = "Autorise la commande enter_shell."
commands.allow = ["enter_shell"]

[[permission]]
identifier = "allow-enter-auth"
description = "Autorise la commande enter_auth."
commands.allow = ["enter_auth"]

[[permission]]
identifier = "allow-win-minimize"
description = "Autorise la commande win_minimize."
commands.allow = ["win_minimize"]

[[permission]]
identifier = "allow-win-toggle-maximize"
description = "Autorise la commande win_toggle_maximize."
commands.allow = ["win_toggle_maximize"]

[[permission]]
identifier = "allow-win-close"
description = "Autorise la commande win_close."
commands.allow = ["win_close"]

[[permission]]
identifier = "allow-win-start-drag"
description = "Autorise la commande win_start_drag."
commands.allow = ["win_start_drag"]

[[permission]]
identifier = "allow-app-hide"
description = "Autorise la commande app_hide."
commands.allow = ["app_hide"]

[[permission]]
identifier = "allow-app-quit"
description = "Autorise la commande app_quit."
commands.allow = ["app_quit"]

# Used by the embedded shell (local window): sign-out / expired session, and
# the daily bearer refresh. An app command with no permission is refused
# even from a local window ("clear_token not allowed").
[[permission]]
identifier = "allow-clear-token"
description = "Autorise la commande clear_token."
commands.allow = ["clear_token"]

[[permission]]
identifier = "allow-logout"
description = "Autorise la commande logout."
commands.allow = ["logout"]
