[package]
name = "drivecord-desktop"
version = "0.1.0"
description = "Client de synchronisation Windows pour Drivecord"
authors = ["LeVraiLunatix"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "drivecord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }

# ── Folder-sync engine (kDrive-style) ────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
aes-gcm = "0.10"
base64 = "0.22"
parking_lot = "0.12"
nanoid = "0.4"

[target.'cfg(windows)'.dependencies]
cloud-filter = "0.0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
