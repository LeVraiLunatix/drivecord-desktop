name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # `tauri::generate_context!()` needs `frontendDist` (../frontend) to exist;
      # the real shell is only built for releases (release.yml) — a stub is enough
      # to type-check and test the Rust side.
      - name: Stub frontend
        shell: bash
        run: mkdir -p frontend && echo "<!doctype html>" > frontend/index.html
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The frontend is Drivecord's own static shell, built from the `discloud`
  # repo by `scripts/build-shell.mjs` at package time — see release.yml (Phase 11).
